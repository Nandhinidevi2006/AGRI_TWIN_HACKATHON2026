version: '3.8'

services:
  backend:
    build: ./backend
    container_name: agritwin_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    environment:
      - DATABASE_URL=sqlite:///data/agritwin.db
    restart: always

  frontend:
    build: ./frontend
    container_name: agritwin_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
